<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Chess Arena"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="/icon.svg"><link rel="apple-touch-icon" href="/icon-180.png"><title>Chess Arena</title><style>body{background:#111827;color:white;font:16px system-ui;margin:0;padding:24px}main{max-width:850px;margin:auto}button,input,select{padding:12px;border-radius:8px;border:0;margin:5px}button{background:#4ade80;cursor:pointer}#board{display:grid;grid-template-columns:repeat(8,1fr);max-width:640px;aspect-ratio:1;margin:20px 0}.sq{display:grid;place-items:center;font-size:clamp(24px,6vw,58px);padding:0;margin:0;border-radius:0}.light{background:#eeeed2}.dark{background:#769656}.selected{outline:4px solid gold;outline-offset:-4px}#status{font-weight:bold}@media(max-width:680px){body{padding:12px}main{width:100%}button,input,select{font-size:16px}#board{width:100%;margin:12px 0}.sq{min-width:0;touch-action:manipulation}section{margin:16px 0}h1{font-size:24px}}@media(display-mode:standalone){body{padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom))}}</style></head><body><main><h1>♞ CHESS ARENA</h1><p>Stockfish-powered online chess</p><button id="install" style="display:none">Install app</button><button id="create">Create online game</button><input id="room" placeholder="Room code"><button id="join">Join game</button><button id="bot">Play Stockfish</button><button id="reset">Restart local game</button><p id="status">Choose a mode</p><div id="board"></div><section><h2>Account</h2><input id="username" placeholder="Username"><input id="password" type="password" placeholder="Password (8+ characters)"><button id="register">Register</button><button id="login">Login</button><span id="account"></span></section><section><h2>Analysis & Review</h2><button id="analyze">Analyze position</button><button id="review">Review this game</button><pre id="reviewResult" style="white-space:pre-wrap;max-height:300px;overflow:auto"></pre></section><section><h2>Leaderboard & Tournaments</h2><button id="leaders">Load leaderboard</button><pre id="leaderboard"></pre><input id="tournamentTitle" placeholder="Tournament name"><button id="createTournament">Create tournament</button><button id="loadTournaments">Browse tournaments</button><div id="tournaments"></div></section><p id="moves"></p><p id="eval"></p></main><script src="/socket.io/socket.io.js"></script><script type="module" src="/app.js"></script><script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(console.warn));let installPrompt;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;document.getElementById("install").style.display="inline-block"});document.getElementById("install").onclick=async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.getElementById("install").style.display="none"};</script></body></html>
