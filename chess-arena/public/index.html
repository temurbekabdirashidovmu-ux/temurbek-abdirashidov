<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chess Arena</title><style>body{background:#111827;color:white;font:16px system-ui;margin:0;padding:24px}main{max-width:850px;margin:auto}button,input,select{padding:12px;border-radius:8px;border:0;margin:5px}button{background:#4ade80;cursor:pointer}#board{display:grid;grid-template-columns:repeat(8,1fr);max-width:640px;aspect-ratio:1;margin:20px 0}.sq{display:grid;place-items:center;font-size:clamp(24px,6vw,58px);padding:0;margin:0;border-radius:0}.light{background:#eeeed2}.dark{background:#769656}.selected{outline:4px solid gold;outline-offset:-4px}#status{font-weight:bold}</style></head><body><main><h1>♞ CHESS ARENA</h1><p>Stockfish-powered online chess</p><button id="create">Create online game</button><input id="room" placeholder="Room code"><button id="join">Join game</button><button id="bot">Play Stockfish</button><button id="reset">Restart local game</button><p id="status">Choose a mode</p><div id="board"></div><p id="moves"></p><p id="eval"></p></main><script src="/socket.io/socket.io.js"></script><script type="module" src="/app.js"></script></body></html>
