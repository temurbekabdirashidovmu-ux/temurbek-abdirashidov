databases:
  - name: sinfportfeli-data
    databaseName: sinfportfeli_data
    user: sinfportfeli_data_user
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []
services:
  - type: web
    name: sinfportfeli-kabinet
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --omit=dev && node --check app.mjs && node --check server.mjs
    startCommand: node server.mjs
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sinfportfeli-data
          property: connectionString
      - key: OWNER_SETUP_HASH
        value: "4966d42cdab20a56f2038109745cfa68a6ab13ae153dbf91279894b128958d62"
      - key: DB_EXPIRES_AT
        value: "2026-12-17T05:17:50.335778Z"
      - key: PORTFOLIO_ORIGIN
        value: https://sinfportfeli-kabinet.onrender.com
  - type: web
    name: sinfportfeli
    runtime: static
    branch: main
    buildCommand: "true"
    staticPublishPath: ./gateway
    autoDeployTrigger: commit
    routes:
      - type: redirect
        source: /*
        destination: https://sinfportfeli-kabinet.onrender.com/
  - type: web
    name: portfel
    runtime: static
    branch: main
    buildCommand: "true"
    staticPublishPath: ./gateway
    autoDeployTrigger: commit
    routes:
      - type: redirect
        source: /*
        destination: https://sinfportfeli-kabinet.onrender.com/
